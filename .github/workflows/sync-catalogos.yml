# Sincronizacion automatica del catalogo de Juguetinstore (jugueteria):
# toma el inventario publicado por la jugueteria (repo publico de GitHub,
# generado 4 veces al dia desde el POS de la tienda), regenera catalogo.js
# con codigos JUG-XXXX permanentes y rehospeda las fotos nuevas en img/p/.
#
# Juguetinstore hereda la estrategia del grupo: un catalogo por repositorio. La
# fuente de juguetes es el repo jugueteriataiwanoficial/jugueteriataiwan
# (maestro); este sync lo absorbe tal cual: precios de vitrina finales.
#
# Requisito (una sola vez): Settings > Actions > General > Workflow permissions
# debe estar en "Read and write permissions" para que el bot pueda hacer push.
name: Sincronizar catalogo

on:
  schedule:
    - cron: "0 */6 * * *" # cada 6 horas (UTC)
  workflow_dispatch: # permite ejecutarlo a mano desde la pestana Actions

permissions:
  contents: write

concurrency:
  group: sync-catalogos
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historial completo: el panel publica data/configuracion.js
                           # por API mientras el cron corre; el push seguro lo absorbe
      - name: Clonar la fuente de juguetes (catalogo maestro de la jugueteria)
        run: git clone --depth 1 https://github.com/jugueteriataiwanoficial/jugueteriataiwan /tmp/jugueteria
      - name: Sincronizar catalogo
        env:
          JUGUETINSTORE_FUENTE_LOCAL: /tmp/jugueteria
        run: python scripts/sync_catalogos.py
      - name: Publicar cambios (si los hay)
        run: |
          git config user.name  "juguetinstore-bot"
          git config user.email "juguetinstore@users.noreply.github.com"
          git add catalogo.js img
          if ! git diff --cached --quiet; then
            git commit -m "sync: actualiza catalogo de juguetes [skip ci]"
            # Si el panel publico la configuracion mientras este cron corria,
            # el repositorio quedo adelante: se absorbe con rebase (el panel
            # solo toca data/configuracion.js, nunca catalogo.js ni img/,
            # asi que no hay conflicto posible) y se reintenta el push.
            if ! git pull --rebase origin main; then
              echo "No se pudo absorber lo publicado por el panel; el catalogo se regenera en la proxima corrida."
              exit 1
            fi
            git push
          else
            echo "Sin cambios: el catalogo ya estaba al dia."
          fi
